  <rect x="310" y="96" width="226" height="190" rx="8" fill="#0f1f17" stroke="#16a34a" stroke-width="1" />
  <text x="326" y="120" fill="#4ade80" font-family="sans-serif" font-size="11" font-weight="bold">Inventory Ledger</text>

  <rect x="326" y="132" width="194" height="48" rx="4" fill="#0b1712" />
  <text x="334" y="148" fill="#86efac" font-family="monospace" font-size="9">SKU-402: 14 units in stock</text>
  <text x="334" y="162" fill="#86efac" font-family="monospace" font-size="9">SKU-209: 3 units [REORDER]</text>
