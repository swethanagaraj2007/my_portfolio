  <rect x="326" y="242" width="194" height="24" rx="4" fill="#15803d" />
  <text x="423" y="258" fill="#f0fdf4" font-family="sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">Print Thermal Receipt</text>
