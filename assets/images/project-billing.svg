  <text x="80" y="255" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">Total: $210.00</text>
  <rect x="180" y="240" width="98" height="26" rx="4" fill="#16a34a" />
  <text x="229" y="257" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Generate Bill</text>

