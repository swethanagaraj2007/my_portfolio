  <rect x="80" y="132" width="198" height="22" rx="4" fill="#14532d" />
  <text x="88" y="147" fill="#bbf7d0" font-family="monospace" font-size="9">Silk Saree #SKU-402  x1  $120.00</text>
  
  <rect x="80" y="160" width="198" height="22" rx="4" fill="#14532d" />
  <text x="88" y="175" fill="#bbf7d0" font-family="monospace" font-size="9">Embroidered Stole    x2  $45.00</text>

  <rect x="80" y="188" width="198" height="22" rx="4" fill="#14532d" />
  <text x="88" y="203" fill="#bbf7d0" font-family="monospace" font-size="9">Jewelry Accent Kit   x1  $35.00</text>

  <line x1="80" y1="220" x2="278" y2="220" stroke="#22c55e" stroke-dasharray="2,2" />
