<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="billBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d" />
      <stop offset="50%" stop-color="#0f291e" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" rx="16" fill="url(#billBg)" />
  <rect x="40" y="36" width="520" height="288" rx="12" fill="#0b1311" stroke="#166534" stroke-width="1.5" />
  <rect x="40" y="36" width="520" height="40" rx="12" fill="#143825" />
  <circle cx="64" cy="56" r="5" fill="#ef4444" /><circle cx="80" cy="56" r="5" fill="#f59e0b" /><circle cx="96" cy="56" r="5" fill="#10b981" />
  <text x="300" y="61" fill="#86efac" font-family="monospace" font-size="12" text-anchor="middle">boutique-pos // desktop-gui-database</text>

  <!-- Left: POS Cart -->
  <rect x="64" y="96" width="230" height="190" rx="8" fill="#11221b" stroke="#15803d" stroke-width="1" />
