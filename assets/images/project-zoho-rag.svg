<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="360" rx="16" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="60" y1="0" x2="60" y2="360" />
    <line x1="120" y1="0" x2="120" y2="360" />
    <line x1="180" y1="0" x2="180" y2="360" />
    <line x1="240" y1="0" x2="240" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="360" y1="0" x2="360" y2="360" />
    <line x1="420" y1="0" x2="420" y2="360" />
    <line x1="480" y1="0" x2="480" y2="360" />
    <line x1="540" y1="0" x2="540" y2="360" />
    <line x1="0" y1="60" x2="600" y2="60" />
    <line x1="0" y1="120" x2="600" y2="120" />
    <line x1="0" y1="180" x2="600" y2="180" />
    <line x1="0" y1="240" x2="600" y2="240" />
    <line x1="0" y1="300" x2="600" y2="300" />
  </g>

  <!-- Glowing Orb -->
  <circle cx="480" cy="90" r="70" fill="url(#accentGrad)" opacity="0.2" filter="url(#glow)" />
  <circle cx="120" cy="280" r="80" fill="url(#cyanGrad)" opacity="0.15" filter="url(#glow)" />

  <!-- Window Header -->
  <rect x="40" y="36" width="520" height="288" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5" />
  <rect x="40" y="36" width="520" height="40" rx="12" fill="#161b22" />
  <circle cx="64" cy="56" r="5" fill="#ff5f56" />
  <circle cx="80" cy="56" r="5" fill="#ffbd2e" />
  <circle cx="96" cy="56" r="5" fill="#27c93f" />
  <text x="300" y="61" fill="#8b949e" font-family="monospace" font-size="12" text-anchor="middle">zoho-rag-assistant // vector-retrieval.py</text>

  <!-- Code / Architecture diagram representation -->
  <!-- Left panel: OpenAPI Parsing -->
  <rect x="64" y="96" width="130" height="190" rx="8" fill="#1f242c" stroke="#38404a" stroke-width="1" />
  <rect x="76" y="110" width="80" height="12" rx="4" fill="#6366f1" opacity="0.8" />
  <text x="76" y="142" fill="#e2e8f0" font-family="monospace" font-size="11">OpenAPI / YAML</text>
  <rect x="76" y="156" width="105" height="6" rx="3" fill="#475569" />
  <rect x="76" y="170" width="85" height="6" rx="3" fill="#475569" />
  <rect x="76" y="184" width="95" height="6" rx="3" fill="#475569" />
  <rect x="76" y="206" width="100" height="24" rx="6" fill="#312e81" stroke="#6366f1" stroke-width="1" />
  <text x="126" y="222" fill="#c7d2fe" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">Dependency Tree</text>

  <!-- Connection Line 1 -->
  <path d="M 194 191 L 236 191" stroke="#6366f1" stroke-width="2" stroke-dasharray="4,4" />
  <polygon points="238,191 230,187 230,195" fill="#6366f1" />

  <!-- Center: Embedding & Sentence Transformer -->
  <rect x="240" y="96" width="130" height="190" rx="8" fill="#1a1c2e" stroke="#6366f1" stroke-width="1.5" />
  <circle cx="305" cy="145" r="28" fill="url(#accentGrad)" opacity="0.9" />
  <text x="305" y="149" fill="#ffffff" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">RAG</text>
  <text x="305" y="196" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">all-MiniLM-L6-v2</text>
  <rect x="256" y="215" width="98" height="20" rx="4" fill="#2e1065" />
  <text x="305" y="229" fill="#c084fc" font-family="monospace" font-size="9" text-anchor="middle">Dense Vectors 384d</text>
  <rect x="256" y="244" width="98" height="6" rx="3" fill="#4c1d95" />

  <!-- Connection Line 2 -->
  <path d="M 370 191 L 412 191" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4,4" />
  <polygon points="414,191 406,187 406,195" fill="#06b6d4" />

  <!-- Right: Qdrant DB & Retrival -->
  <rect x="416" y="96" width="124" height="190" rx="8" fill="#13232c" stroke="#0891b2" stroke-width="1.2" />
  <rect x="430" y="114" width="96" height="22" rx="4" fill="#0e7490" />
  <text x="478" y="129" fill="#e0f2fe" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">Qdrant Vector DB</text>
  
  <!-- Points representation in vector space -->
  <circle cx="450" cy="165" r="4" fill="#38bdf8" />
  <circle cx="485" cy="160" r="5" fill="#06b6d4" />
  <circle cx="510" cy="175" r="3.5" fill="#38bdf8" />
  <circle cx="465" cy="195" r="4" fill="#22d3ee" />
  <circle cx="495" cy="205" r="5" fill="#0284c7" />
  
  <rect x="430" y="235" width="96" height="32" rx="6" fill="#082f49" stroke="#0284c7" stroke-width="1" />
  <text x="478" y="249" fill="#7dd3fc" font-family="monospace" font-size="9" text-anchor="middle">Cosine Similarity</text>
  <text x="478" y="260" fill="#38bdf8" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">score: 0.942</text>
</svg>
