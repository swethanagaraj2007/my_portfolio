  <rect x="78" y="130" width="152" height="12" rx="2" fill="#334155" />
  <rect x="78" y="148" width="70" height="8" rx="2" fill="#475569" />
  <rect x="154" y="148" width="76" height="8" rx="2" fill="#475569" />
  
  <rect x="78" y="164" width="152" height="48" rx="4" fill="#0f172a" />
  <text x="84" y="178" fill="#f87171" font-family="monospace" font-size="8.5">Voltage: 3.3V +/- 5%</text>
