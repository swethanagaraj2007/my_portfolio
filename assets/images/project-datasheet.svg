  <text x="84" y="204" fill="#f87171" font-family="monospace" font-size="8.5">Temp: -40C to +85C</text>

  <rect x="78" y="222" width="152" height="48" rx="4" fill="#334155" opacity="0.6" />
  <text x="154" y="250" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">[Heterogeneous Layout]</text>

  <!-- Process Arrow -->
  <path d="M 252 191 L 278 191" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3" />
  <polygon points="280,191 272,187 272,195" fill="#38bdf8" />

  <!-- Right: Branded Output -->
  <rect x="286" y="96" width="250" height="190" rx="8" fill="#1e293b" stroke="#0284c7" stroke-width="1.2" />
  <rect x="286" y="96" width="250" height="26" rx="8" fill="#0284c7" />
  <text x="298" y="113" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold">STANDARDIZED BRANDED DATASHEET</text>

  <rect x="300" y="132" width="222" height="24" rx="4" fill="#0369a1" />
  <text x="310" y="148" fill="#e0f2fe" font-family="sans-serif" font-size="9" font-weight="600">Electrical Characteristics Table</text>

  <rect x="300" y="162" width="222" height="66" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
