      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" rx="16" fill="url(#dsBg)" />
  <rect x="40" y="36" width="520" height="288" rx="12" fill="#0b1120" stroke="#1e293b" stroke-width="1.5" />
  <rect x="40" y="36" width="520" height="40" rx="12" fill="#151e32" />
  <circle cx="64" cy="56" r="5" fill="#ef4444" /><circle cx="80" cy="56" r="5" fill="#f59e0b" /><circle cx="96" cy="56" r="5" fill="#10b981" />
  <text x="300" y="61" fill="#94a3b8" font-family="monospace" font-size="12" text-anchor="middle">datasheet-converter // paged-media-pipeline</text>

  <!-- Left: Raw Supplier Datasheet -->
  <rect x="64" y="96" width="180" height="190" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
