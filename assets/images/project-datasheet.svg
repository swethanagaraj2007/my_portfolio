  <text x="310" y="206" fill="#7dd3fc" font-family="monospace" font-size="8.5">Oper. Temp  | -40 | 25  | 85  | C</text>
  <text x="310" y="220" fill="#4ade80" font-family="monospace" font-size="8.5">Status: Normalized (100% Page Match)</text>

  <rect x="300" y="238" width="222" height="34" rx="4" fill="#0c4a6e" />
  <text x="411" y="259" fill="#bae6fd" font-family="sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">Export Branded PDF (CSS Paged)</text>
